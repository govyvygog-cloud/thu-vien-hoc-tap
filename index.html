<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Học Tập Quốc Gia - Lớp 1 đến Lớp 12</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .card h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-size: 1.5rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--secondary-color);
        }

        .btn:active {
            transform: scale(0.98);
        }

        footer {
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
            font-size: 0.9rem;
        }

        footer .founder-info {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            opacity: 0.85;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            .card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Thư Viện Học Tập Quốc Gia</h1>
        <p>Hệ thống tài liệu học tập toàn diện từ Lớp 1 đến Lớp 12</p>
    </header>

    <div class="container">
        <!-- Khung tải tài liệu lên lớp học -->
        <div class="card">
            <h2>Tải Tài Liệu Lên Hệ Thống</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="docTitle">Tiêu đề tài liệu</label>
                    <input type="text" id="docTitle" class="form-control" placeholder="Nhập tiêu đề tài liệu..." required>
                </div>

                <div class="form-group">
                    <label for="targetClass">Chọn Khối Lớp</label>
                    <select id="targetClass" class="form-control" required>
                        <option value="">-- Chọn khối lớp (Từ Lớp 1 đến 12) --</option>
                        <option value="lop-1">Lớp 1</option>
                        <option value="lop-2">Lớp 2</option>
                        <option value="lop-3">Lớp 3</option>
                        <option value="lop-4">Lớp 4</option>
                        <option value="lop-5">Lớp 5</option>
                        <option value="lop-6">Lớp 6</option>
                        <option value="lop-7">Lớp 7</option>
                        <option value="lop-8">Lớp 8</option>
                        <option value="lop-9">Lớp 9</option>
                        <option value="lop-10">Lớp 10</option>
                        <option value="lop-11">Lớp 11</option>
                        <option value="lop-12">Lớp 12</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="docFile">Chọn file tài liệu (PDF, Hình ảnh...)</label>
                    <input type="file" id="docFile" class="form-control" required>
                </div>

                <button type="submit" class="btn">Tải lên hệ thống</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Thư Viện Học Tập Quốc Gia. Bảo lưu mọi quyền.</p>
        <div class="founder-info">
            Nhà sáng lập: <strong>Nguyễn Danh Nhân</strong> | Email: <code>ygyybtbtg@gmail.com</code>
            <br>Thông điệp: "Tri thức là chìa khóa mở cánh cửa tương lai."
        </div>
    </footer>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Tải tài liệu lên lớp học thành công!');
            this.reset();
        });
    </script>
</body>
</html>
